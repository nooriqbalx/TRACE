[project]
name = "tracesec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nooriqbalx", email = "iamnooriqbal@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
tracesec = "tracesec:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=tracesec --cov-report=term-missing"
